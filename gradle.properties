org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Where the debug build talks to the Fundaza server. 10.0.2.2 is the host
# machine as seen from the Android emulator (`php artisan serve` on port 8000).
# Override per machine in ~/.gradle/gradle.properties or with -P.
fundaza.apiBaseUrl.debug=https://stg.fundaza.co.ke/
fundaza.apiBaseUrl.release=https://stg.fundaza.co.ke/
